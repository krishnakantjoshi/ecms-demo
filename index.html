<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>eCMS – Compensation Portal (Prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   DESIGN TOKENS — derived from Assam SWF 2.0 district theme
   ========================================================= */
:root{
  --saffron:#ff9d00; --orange:#f47d24; --plum:#801843; --plum-deep:#2e062c;
  --gold:#ffc000; --blue:#0871ff; --blue-600:#005ad0; --navy:#003b9f;
  --ink:#081828; --title:#2c4964; --red:#cd0f21;
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#f8f9fc; --border:#e2e6ee; --border-2:#d3d9e4;
  --text:#1c2433; --muted:#5d6779; --faint:#8a93a3;
  --ok:#11804a; --ok-bg:#e5f5ec; --warn:#9a5700; --warn-bg:#fff3d9; --bad:#c0262d; --bad-bg:#fde8ea;
  --info:#0b5ed7; --info-bg:#e7f0ff; --neutral-bg:#eef1f5; --violet:#6b3fb8; --violet-bg:#f1eafd;
  --side-bg:linear-gradient(180deg,#1d0a24 0%,#0c1a2c 55%,#081828 100%);
  --grad:linear-gradient(90deg,#ff9d00 0%,#ed6e2d 20%,#be3941 45%,#801843 70%,#2e062c 100%);
  --strip:linear-gradient(90deg,#fff 0%,#fff6ea 55%,#ffd9b8 100%);
  --radius:10px; --radius-sm:7px;
  --sh-sm:0 1px 2px rgba(8,24,40,.05),0 1px 3px rgba(8,24,40,.07);
  --sh:0 6px 22px rgba(8,24,40,.08);
  --sh-lg:0 22px 60px rgba(8,24,40,.22);
  --font:"Noto Sans","Noto Sans Bengali","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.75,.2,1);
}
html{font-size:15px;scroll-behavior:smooth}
html[data-fs="-1"]{font-size:13.5px} html[data-fs="1"]{font-size:16.5px} html[data-fs="2"]{font-size:18px}
/* High-contrast mode (SWF accessibility parity) */
html[data-contrast="high"]{
  --bg:#000; --surface:#0a0a0a; --surface-2:#111; --border:#fff; --border-2:#fff; --text:#fff; --muted:#ffe600; --faint:#ffe600;
  --blue:#ffe600; --blue-600:#ffe600; --title:#fff; --ok-bg:#000; --warn-bg:#000; --bad-bg:#000; --info-bg:#000; --neutral-bg:#000; --violet-bg:#000;
  --ok:#7CFF9B; --warn:#ffe600; --bad:#ff8a8a; --info:#9cc8ff; --violet:#e0c8ff; --strip:#000; --red:#ff8a8a;
}
html[data-contrast="high"] .btn.primary{background:#ffe600;color:#000}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.5;-webkit-font-smoothing:antialiased;font-size:1rem}
a{color:var(--blue);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;color:var(--text);line-height:1.25}
.ic{flex:none;display:inline-block;vertical-align:middle}
:focus-visible{outline:3px solid rgba(8,113,255,.45);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:4px;background:var(--gold);color:#000;padding:6px 12px;border-radius:6px;z-index:999}
.skip:focus{left:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:.86rem} .xs{font-size:.78rem}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrap{flex-wrap:wrap} .grow{flex:1}
.stack{display:flex;flex-direction:column;gap:14px}

/* ================= GOV STRIP + BRAND BAR ================= */
.gov-strip{background:var(--strip);border-bottom:1px solid #f1dcc6;font-size:.8rem;height:34px;display:flex;align-items:center;padding:0 20px;gap:14px;color:#222}
html[data-contrast="high"] .gov-strip{color:#fff;border-color:#fff}
.gov-strip .tri{display:inline-flex;width:18px;height:12px;border-radius:2px;overflow:hidden;flex-direction:column;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.gov-strip .tri i{flex:1}.tri i:nth-child(1){background:#ff9933}.tri i:nth-child(2){background:#fff}.tri i:nth-child(3){background:#138808}
.gov-strip .sep{width:1px;height:16px;background:#c9b9a8}
.a11y{display:flex;gap:4px;align-items:center}
.a11y button{border:1px solid #d9c8b5;background:rgba(255,255,255,.7);border-radius:5px;height:24px;min-width:26px;padding:0 6px;cursor:pointer;font-size:.76rem;font-weight:700;transition:.15s}
.a11y button:hover{background:#fff;border-color:var(--orange)}
.a11y button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.lang-sel{display:flex;align-items:center;gap:6px}
.lang-sel select{height:24px;border:1px solid #d9c8b5;border-radius:5px;background:#fff;padding:0 6px;font-size:.8rem;cursor:pointer}

.brandbar{background:var(--surface);display:flex;align-items:center;gap:16px;padding:10px 20px;min-height:68px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:0 1 auto}
.brand-text{min-width:0}
.emblem{position:relative;width:40px;height:62px;flex:none;display:grid;place-items:center}
.emblem img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:2}
.emblem-ph{width:44px;height:50px;border:2px dashed #c9a24a;border-radius:8px;display:grid;place-items:center;font-size:7px;letter-spacing:.06em;font-weight:700;color:#9a7a2a;text-align:center;line-height:1.1;background:repeating-linear-gradient(45deg,#fffaf0,#fffaf0 4px,#fff 4px,#fff 8px)}
.brand-text .g{font-size:.74rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#000}
html[data-contrast="high"] .brand-text .g{color:#fff}
.brand-text .p{font-size:1.18rem;font-weight:700;color:var(--title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-text .s{font-size:.8rem;color:var(--red);font-weight:500}
.proto-tag{font-size:.68rem;font-weight:700;letter-spacing:.05em;color:#7a4a00;background:#fff1cf;border:1px solid #f3d489;border-radius:20px;padding:2px 8px;white-space:nowrap}
.grad-line{height:4px;background:var(--grad)}
.topbar{position:sticky;top:0;z-index:40;box-shadow:0 2px 14px rgba(25,40,80,.08)}

.hsearch{flex:0 1 360px;min-width:44px;margin-left:auto;position:relative}
.hsearch .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hsearch button{width:100%;height:38px;border:1px solid var(--border);background:var(--surface-2);border-radius:9px;display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--faint);cursor:pointer;transition:.2s}
.hsearch button:hover{border-color:var(--border-2);background:var(--surface)}
.kbd{white-space:nowrap;margin-left:auto;font-size:.7rem;border:1px solid var(--border-2);border-radius:5px;padding:1px 6px;color:var(--muted);background:var(--surface)}
.fy{height:38px;border:1px solid var(--border);border-radius:9px;background:var(--surface);padding:0 10px;font-weight:600;font-size:.86rem}
.icon-btn{position:relative;width:38px;height:38px;border-radius:9px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--muted);transition:.15s}
.icon-btn:hover{color:var(--text);border-color:var(--border-2);transform:translateY(-1px)}
.dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--surface)}
.me{display:flex;align-items:center;gap:9px;padding:4px 8px 4px 4px;border-radius:10px;border:1px solid transparent;background:none;cursor:pointer}
.me:hover{border-color:var(--border);background:var(--surface-2)}
.me .n,.me .d{white-space:nowrap}.me .n{font-weight:600;font-size:.86rem;line-height:1.1;text-align:left}.me .d{font-size:.72rem;color:var(--muted);text-align:left}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.8rem;color:#fff;flex:none;background:linear-gradient(135deg,#ed6e2d,#801843)}
.av.lg{width:64px;height:64px;font-size:1.3rem}.av.sm{width:28px;height:28px;font-size:.7rem}
.menu-btn{display:none}

/* ================= LAYOUT ================= */
.layout{display:grid;grid-template-columns:252px 1fr;min-height:calc(100vh - 106px)}
.sidebar{background:var(--side-bg);color:#c9d2e0;padding:14px 10px 20px;position:sticky;top:106px;height:calc(100vh - 106px);overflow:auto;scrollbar-width:thin}
.sidebar .grp{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#7f8aa0;padding:14px 12px 6px}
.nav-a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:#cfd7e4;font-size:.9rem;position:relative;transition:background .18s,color .18s}
.nav-a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-a.on{background:linear-gradient(90deg,rgba(255,192,0,.16),rgba(255,192,0,.02));color:#fff;font-weight:600}
.nav-a.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--gold)}
.nav-a .b{margin-left:auto;background:var(--orange);color:#fff;font-size:.7rem;font-weight:700;border-radius:20px;padding:0 7px;line-height:18px}
.side-foot{margin-top:18px;border-top:1px solid rgba(255,255,255,.08);padding-top:10px}
.side-note{margin:14px 6px 0;padding:10px 12px;border-radius:8px;background:rgba(255,255,255,.05);font-size:.75rem;color:#9aa5b8;line-height:1.45}
main{padding:22px 26px 40px;min-width:0}
.page{animation:pageIn .38s var(--ease) both}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.stag>*{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.foot{margin-top:34px;padding-top:14px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.76rem;color:var(--faint)}

/* ================= PAGE HEADER ================= */
.crumbs{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--faint);margin-bottom:8px}
.crumbs a{color:var(--muted)} .crumbs a:hover{color:var(--blue)}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.pt{position:relative;padding-bottom:12px;font-size:1.5rem;font-weight:700;color:var(--title)}
.pt::before,.ct::before{content:"";position:absolute;left:0;bottom:0;width:56px;height:4px;border-radius:3px;background:var(--gold)}
.pt::after,.ct::after{content:"";position:absolute;left:0;bottom:0;width:38px;height:4px;border-radius:3px;background:var(--blue)}
.psub{color:var(--muted);font-size:.88rem;margin-top:8px}
.acts{display:flex;gap:8px;flex-wrap:wrap}

/* ================= BUTTONS / INPUTS ================= */
.btn{height:38px;display:inline-flex;align-items:center;gap:7px;padding:0 14px;border-radius:8px;border:1px solid var(--border-2);background:var(--surface);cursor:pointer;font-weight:600;font-size:.87rem;transition:transform .12s,box-shadow .2s,background .2s,border-color .2s;white-space:nowrap}
.btn:hover{border-color:#b9c2d1;box-shadow:var(--sh-sm)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(8,113,255,.25)}
.btn.primary:hover{background:var(--blue-600)}
.btn.gold{background:var(--gold);border-color:#eab000;color:#111}
.btn.gold:hover{background:#ffcb2e}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--surface);border-color:#f0b7bb;color:var(--bad)}
.btn.bad:hover{background:var(--bad-bg)}
.btn.ghost{background:transparent}
.btn.sm{height:30px;padding:0 10px;font-size:.8rem}
.btn.block{width:100%;justify-content:center;height:44px;font-size:.95rem}
.btn[disabled]{opacity:.55;pointer-events:none}
.link{background:none;border:0;padding:0;color:var(--blue);cursor:pointer;font-weight:600}
label.f{display:flex;flex-wrap:wrap;column-gap:4px;row-gap:5px;font-size:.8rem;font-weight:600;color:var(--muted)}
label.f .req{color:var(--bad)}
label.f>*:not(.req){flex-basis:100%}
.nw{white-space:nowrap}
.grid{align-items:start}
.fp{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.fp-aside{position:sticky;top:122px}
.fsec{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;padding:24px;border-bottom:1px solid var(--border)}
.fsec:last-child{border-bottom:0}
.fsec h3{font-size:.98rem;color:var(--text)}.fsec p{margin:6px 0 0;font-size:.8rem;color:var(--muted);line-height:1.5}
.fbar{position:sticky;bottom:0;z-index:5;margin-top:16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px;display:flex;gap:8px;align-items:center;box-shadow:0 -6px 20px rgba(8,24,40,.07)}
.ig{display:flex}.ig .inp{border-radius:8px 0 0 8px;flex:1;min-width:0}.ig .btn{border-radius:0 8px 8px 0;height:40px;margin-left:-1px;flex:none}
label.f .btn{height:40px}
.inp[readonly]{background:var(--surface-2);color:var(--muted)}
.inp-unit{position:relative;flex:1;display:block}.inp-unit .inp{padding-right:28px}.inp-unit>span{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:.75rem;color:var(--faint);font-weight:700}
.chk input.err{outline:2px solid var(--bad);outline-offset:2px}
.consent{padding:12px 14px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);line-height:1.5}
.swrow{padding:12px 14px;border:1px solid var(--border);border-radius:9px}
.stp.clk{cursor:pointer}.stp.clk:hover .t{color:var(--blue)}
.codechip{display:inline-block;font-weight:700;font-size:.78rem;color:var(--navy);background:var(--info-bg);border:1px solid #cfe0ff;border-radius:6px;padding:2px 8px;white-space:nowrap}
html[data-contrast="high"] .codechip{color:#ffe600;border-color:#fff}
.code{white-space:nowrap;font-size:.9rem;font-weight:700;display:flex;flex-wrap:nowrap;gap:1px;margin:12px 0;padding:12px;background:var(--surface-2);border:1px dashed var(--border-2);border-radius:8px}
.code i{color:var(--faint);font-style:normal}
.cs0{color:#be3941}.cs1{color:#0871ff}.cs2{color:#7b3fbf}.cs3{color:#0f9d8a}.cs4{color:var(--text)}.cs5{color:#c0551a}
.legend2{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px;margin-bottom:12px}.legend2 div{display:flex;flex-direction:column}.legend2 span{font-weight:700;font-size:.8rem}.legend2 small{font-size:.7rem;color:var(--faint)}
.sw{width:28px;height:28px;border-radius:8px;border:0;cursor:pointer}.sw.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--text)}
.inst-h{font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin-bottom:0}
.inst .icon-btn{width:34px;height:34px}
#hTbl td{padding:8px 10px}#hTbl td:first-child,#hTbl th:first-child{padding-left:12px}
.brand-text .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fp.wide{grid-template-columns:minmax(0,1fr)}.fp.wide .fp-aside{display:none}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface);text-align:left;font:inherit;color:inherit;transition:border-color .15s,box-shadow .15s}
button.tile[data-act]{cursor:pointer}button.tile[data-act]:hover{border-color:var(--border-2)}
.tile span{color:var(--muted);font-weight:600}.tile b{font-size:1.35rem;color:var(--text)}
.tile.ok b{color:var(--ok)}.tile.warn b{color:var(--warn)}.tile.bad b{color:var(--bad)}
.tile.on{border-color:var(--blue);box-shadow:0 0 0 3px rgba(8,113,255,.12)}
.filecard{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);flex-wrap:wrap}
.fi.xl{width:40px;height:46px;border-radius:7px;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;font-size:.64rem;font-weight:800;flex:none}
.drop.big{display:block;padding:40px 20px}
.dz-ic{width:58px;height:58px;border-radius:50%;background:var(--info-bg);color:var(--info);display:inline-grid;place-items:center;transition:transform .2s var(--ease)}
.drop.over .dz-ic{transform:scale(1.1)}
.msgs{margin:6px 0 0;padding-left:16px;font-size:.76rem;line-height:1.45}.msgs .e{color:var(--bad)}.msgs .w{color:var(--warn)}
tr.vr.err td:first-child{box-shadow:inset 3px 0 0 var(--bad)}tr.vr.warn td:first-child{box-shadow:inset 3px 0 0 var(--orange)}
.import-run{display:flex;flex-direction:column;align-items:center;gap:10px;padding:34px 10px;text-align:center}
.spin{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;color:var(--blue);background:var(--info-bg);animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.prog.lg{height:10px;width:min(460px,100%);margin-top:6px}.prog.lg i{transition:none;background:linear-gradient(90deg,#0871ff,#3a8dff)}
.done-ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--ok-bg);color:var(--ok);animation:pop2 .5s var(--ease)}
@keyframes pop2{from{transform:scale(.4);opacity:0}}
.rcards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.rcard{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:border-color .15s,background .15s}
.rcard>span{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.rcard b{font-size:.88rem}.rcard input[type=radio]{margin-top:3px;accent-color:var(--blue)}
.rcard.on{border-color:var(--blue);background:var(--info-bg)}
.ig .addon{display:grid;place-items:center;padding:0 10px;border:1px solid var(--border-2);background:var(--surface-2);font-weight:700;color:var(--muted);height:40px}
.ig .addon:last-child{border-radius:0 8px 8px 0;border-left:0}.ig .addon:first-child{border-radius:8px 0 0 8px;border-right:0}
.ig .addon:first-child+.inp{border-radius:0 8px 8px 0}
.rcard .ig{width:100%}.rcard .ig .inp,.rcard .ig .addon{height:34px}
.cbx{width:17px;height:17px;accent-color:var(--blue);cursor:pointer;vertical-align:middle}
.cbcell{width:44px}
.who .d.mono{white-space:nowrap}
.tbl tr.sel td{background:#eef5ff}
html[data-contrast="high"] .tbl tr.sel td{background:#222}
.selrow{cursor:pointer}.bad-t{color:var(--bad)}
.route{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--border);border-radius:10px}
.route .ri-ic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--info-bg);color:var(--info);flex:none}
.route.hv .ri-ic{background:var(--warn-bg);color:var(--warn)}
.bulkbar{position:fixed;bottom:22px;left:calc(252px + (100vw - 252px)/2);transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;padding:8px 10px 8px 16px;border-radius:12px;box-shadow:var(--sh-lg);animation:toastIn .3s var(--ease)}
.bulkbar .btn:not(.primary){background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}.bulkbar .btn:not(.primary):hover{background:rgba(255,255,255,.1)}
.bulkbar .sep{width:1px;height:20px;background:rgba(255,255,255,.2)}
@media (max-width:960px){.bulkbar{left:50%}}
@media (max-width:1100px){.tiles,.rcards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.grid>*{min-width:0}
.inp,select.inp,textarea.inp{height:40px;border:1px solid var(--border-2);border-radius:8px;background:var(--surface);padding:0 11px;font-size:.9rem;color:var(--text);font-weight:400;transition:border-color .15s,box-shadow .15s;width:100%}
textarea.inp{height:auto;min-height:84px;padding:9px 11px;resize:vertical}
.inp:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(8,113,255,.12)}
.inp.err{border-color:var(--bad);box-shadow:0 0 0 4px rgba(192,38,45,.08)}
.hint{font-size:.74rem;font-weight:400;color:var(--faint)}
.inp-ic>.ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint)}.inp-ic .inp{padding-left:36px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}.spanall{grid-column:1/-1}
.switch{position:relative;width:40px;height:22px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;border-radius:20px;background:#c6cdd8;transition:.2s;cursor:pointer}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.22s var(--ease)}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span::after{transform:translateX(18px)}
.chk{display:flex;align-items:flex-start;gap:9px;font-size:.87rem;cursor:pointer}
.chk input{width:16px;height:16px;margin-top:2px;accent-color:var(--blue)}

/* ================= CARDS / KPIs ================= */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--sh-sm)}
.card.pad{padding:18px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px 0}
.ct{position:relative;font-size:1rem;font-weight:700;padding-bottom:9px;color:var(--text)}
.ct::before{height:3px;width:40px}.ct::after{height:3px;width:26px}
.cb{padding:16px 18px 18px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi{padding:16px 16px 14px;position:relative;overflow:hidden;transition:transform .2s var(--ease),box-shadow .2s}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--sh)}
.kpi .l{font-size:.78rem;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:7px}
.kpi .l .ib{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--info-bg);color:var(--info)}
.kpi.ok .ib{background:var(--ok-bg);color:var(--ok)}.kpi.warn .ib{background:var(--warn-bg);color:var(--warn)}.kpi.vio .ib{background:var(--violet-bg);color:var(--violet)}.kpi.red .ib{background:var(--bad-bg);color:var(--bad)}
.kpi .v{font-size:1.55rem;font-weight:700;margin-top:10px;letter-spacing:-.01em;color:var(--text)}
.kpi .s{font-size:.76rem;color:var(--faint);margin-top:2px}
.kpi .accent{display:none}
.kpi.ok .accent{background:var(--ok)}.kpi.warn .accent{background:var(--orange)}.kpi.vio .accent{background:var(--violet)}.kpi.red .accent{background:var(--bad)}
.prog{height:6px;border-radius:6px;background:var(--neutral-bg);overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;width:0;border-radius:6px;background:var(--ok);transition:width 1.1s var(--ease)}
.ready .prog i{width:var(--w)}
.dash-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}

/* bars */
.hbar{display:grid;grid-template-columns:170px 1fr 120px;gap:12px;align-items:center;padding:8px 0}
.hbar .lbl{font-size:.83rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .trk{position:relative;height:22px;border-radius:6px;background:var(--neutral-bg);overflow:hidden}
.hbar .trk i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:6px;transition:width 1.1s var(--ease)}
.hbar .trk i.a{background:repeating-linear-gradient(45deg,#dbe6f7,#dbe6f7 6px,#e8effa 6px,#e8effa 12px)}
.hbar .trk i.aw{background:#9ec3ff}
.hbar .trk i.p{background:linear-gradient(90deg,#0871ff,#3a8dff)}
.ready .hbar .trk i{width:var(--w)}
.hbar .val{font-size:.8rem;text-align:right}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.donut{--p1:0;width:170px;height:170px;border-radius:50%;position:relative;margin:6px auto 14px;transition:transform .6s var(--ease);transform:rotate(-90deg) scale(.85);opacity:0}
.ready .donut{transform:rotate(0) scale(1);opacity:1;transition:transform .9s var(--ease),opacity .5s}
.donut::after{content:"";position:absolute;inset:26px;border-radius:50%;background:var(--surface)}
.donut .c{position:absolute;inset:0;display:grid;place-items:center;z-index:2;text-align:center}
.donut .c b{font-size:1.25rem;display:block}.donut .c small{font-size:.72rem;color:var(--muted)}
.trend path.ln{stroke-dasharray:1400;stroke-dashoffset:1400;transition:stroke-dashoffset 1.6s var(--ease)}
.ready .trend path.ln{stroke-dashoffset:0}
.trend path.ar{opacity:0;transition:opacity 1s .5s}
.ready .trend path.ar{opacity:1}
.pipe{display:flex;flex-direction:column;gap:8px}
.pipe .st{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border)}
.pipe .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:700;background:var(--info-bg);color:var(--info)}
.pipe .cnt{font-weight:700;font-size:1rem}

/* ================= TABLES ================= */
.tbl-wrap{overflow:auto;border-top:1px solid var(--border)}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.86rem}
.tbl th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;z-index:1}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .15s}
.tbl tbody tr:hover{background:#f7faff}
html[data-contrast="high"] .tbl tbody tr:hover{background:#222}
.tbl tr.click{cursor:pointer}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--border-2)}
.who{display:flex;align-items:center;gap:10px;min-width:200px}
.who .n{font-weight:600;line-height:1.2}.who .d{font-size:.75rem;color:var(--muted)}
.mini{display:flex;flex-direction:column;gap:4px;min-width:120px}
.mini .prog{margin-top:0;height:5px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 18px}
.toolbar .inp{height:36px;font-size:.85rem}
.toolbar select.inp{width:auto;min-width:150px}
.pager{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-top:1px solid var(--border);font-size:.82rem;color:var(--muted);gap:10px;flex-wrap:wrap}
.pager .pg{display:flex;gap:4px}
.pager button{min-width:32px;height:30px;border-radius:7px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:600}
.pager button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}
.empty .ei{width:54px;height:54px;border-radius:50%;background:var(--neutral-bg);display:grid;place-items:center;margin:0 auto 12px;color:var(--faint)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:600;border-radius:20px;padding:3px 10px;white-space:nowrap;background:var(--neutral-bg);color:var(--muted)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.nod::before{display:none}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.info{background:var(--info-bg);color:var(--info)}.chip.vio{background:var(--violet-bg);color:var(--violet)}
.chip.pulse::before{animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
.seg{display:inline-flex;background:var(--neutral-bg);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:600;font-size:.82rem;cursor:pointer;color:var(--muted);transition:.18s}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--sh-sm)}
.seg button .c{font-size:.7rem;margin-left:5px;background:var(--border);border-radius:10px;padding:0 6px}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);padding:0 18px;overflow:auto}
.tabs button{border:0;background:none;padding:12px 12px;font-weight:600;font-size:.87rem;color:var(--muted);cursor:pointer;position:relative;white-space:nowrap}
.tabs button::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--blue);transform:scaleX(0);transition:transform .25s var(--ease)}
.tabs button.on{color:var(--text)}.tabs button.on::after{transform:scaleX(1)}
.tabpane{animation:pageIn .3s var(--ease) both}

/* key-value */
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 22px}
.kv div small{display:block;font-size:.74rem;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.kv div span{font-weight:500}
.sec-t{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:4px 0 12px;display:flex;align-items:center;gap:8px}
.sec-t::after{content:"";flex:1;height:1px;background:var(--border)}

/* profile header */
.hero{padding:20px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;position:relative;overflow:hidden}

.hero .nm{font-size:1.3rem;font-weight:700}
.money{display:flex;gap:10px}
.money div{padding:10px 14px;border-radius:9px;background:var(--surface-2);border:1px solid var(--border);min-width:130px}
.money small{display:block;font-size:.72rem;color:var(--muted);font-weight:600}
.money b{font-size:1.08rem}

/* timeline */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--border)}
.tl .it{position:relative;padding:0 0 18px}
.tl .it::before{content:"";position:absolute;left:-22px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--ok)}
.tl .it.cur::before{border-color:var(--orange);box-shadow:0 0 0 5px rgba(244,125,36,.18)}
.tl .it.pend::before{border-color:var(--border-2)}
.tl .it b{font-size:.9rem}.tl .it p{margin:2px 0 0;font-size:.82rem;color:var(--muted)}

/* documents */
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.doc{border:1px solid var(--border);border-radius:9px;padding:12px;display:flex;gap:11px;align-items:flex-start;background:var(--surface);transition:.2s}
.doc:hover{border-color:#b9cdf0;box-shadow:var(--sh-sm);transform:translateY(-2px)}
.doc .fi{width:38px;height:44px;border-radius:6px;background:#fdecee;color:#c0262d;display:grid;place-items:center;font-size:.62rem;font-weight:800;flex:none}
.doc .fi.img{background:#e8f1ff;color:var(--info)}
.doc .t{font-weight:600;font-size:.86rem;line-height:1.25}
.drop{border:2px dashed var(--border-2);border-radius:10px;padding:22px;text-align:center;color:var(--muted);transition:.2s;cursor:pointer;background:var(--surface-2)}
.drop:hover,.drop.over{border-color:var(--blue);background:var(--info-bg);color:var(--info)}

/* stepper */
.stepper{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);padding:18px 10px 16px}
.stp{display:flex;flex-direction:column;align-items:center;gap:7px;position:relative;min-width:0;text-align:center}
.stp:not(:first-child)::before{content:"";position:absolute;top:14px;left:calc(-50% + 22px);right:calc(50% + 22px);height:2px;border-radius:2px;background:var(--border);transition:background .4s}
.stp.done+.stp::before{background:var(--ok)}
.stp .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.8rem;border:2px solid var(--border-2);color:var(--muted);background:var(--surface);transition:.3s var(--ease);flex:none}
.stp.on .n{border-color:var(--blue);color:#fff;background:var(--blue);box-shadow:0 0 0 5px rgba(8,113,255,.15)}
.stp.done .n{border-color:var(--ok);background:var(--ok);color:#fff}
.stp .t{font-size:.78rem;font-weight:600;line-height:1.25;padding:0 4px}
.stp.pend .t{color:var(--faint)}

/* workflow canvas */
.wf{display:flex;align-items:stretch;gap:0;overflow:auto;padding:8px 2px 14px}
.wf .node{min-width:168px;max-width:190px;border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--surface);box-shadow:var(--sh-sm);position:relative;animation:rise .5s var(--ease) both;animation-delay:calc(var(--i)*90ms)}
.wf .node .k{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.wf .node .r{font-weight:700;font-size:.88rem;margin:3px 0 6px}
.wf .node.cur{border-color:var(--orange);box-shadow:0 0 0 4px rgba(244,125,36,.14)}
.wf .node.done{border-color:#b8e0c8}
.wf .arrow{display:grid;place-items:center;min-width:34px;color:var(--faint)}
.wf .node .top{display:none}

/* ================= OVERLAYS ================= */
.scrim{position:fixed;inset:0;background:rgba(8,24,40,.45);backdrop-filter:blur(2px);z-index:80;opacity:0;animation:fade .2s forwards}
@keyframes fade{to{opacity:1}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--surface);z-index:90;box-shadow:var(--sh-lg);display:flex;flex-direction:column;transform:translateX(100%);animation:slideIn .34s var(--ease) forwards}
@keyframes slideIn{to{transform:none}}
.drawer.out{animation:slideOut .25s ease-in forwards}
@keyframes slideOut{from{transform:none}to{transform:translateX(100%)}}
.dh{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}
.dh h3{font-size:1.08rem}
.db{padding:20px;overflow:auto;flex:1}
.df{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;background:var(--surface-2)}
.modal{position:fixed;left:50%;top:50%;width:min(480px,94vw);background:var(--surface);z-index:95;border-radius:14px;box-shadow:var(--sh-lg);transform:translate(-50%,-46%) scale(.96);opacity:0;animation:pop .28s var(--ease) forwards;max-height:90vh;overflow:auto}
.modal.wide{width:min(720px,96vw)}
@keyframes pop{to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.toasts{position:fixed;right:18px;bottom:18px;z-index:120;display:flex;flex-direction:column;gap:8px}
.toast{min-width:280px;max-width:380px;background:var(--ink);color:#fff;border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;box-shadow:var(--sh-lg);animation:toastIn .35s var(--ease) both;font-size:.87rem}
.toast .ti{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;background:#1f9d5c}
.toast.warn .ti{background:#d98300}.toast.bad .ti{background:#c0262d}.toast.info .ti{background:#0871ff}
.toast.out{animation:toastOut .3s forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(30px)}}
.pop{position:absolute;top:calc(100% + 8px);right:0;width:340px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--sh-lg);z-index:60;animation:rise .22s var(--ease) both;overflow:hidden}
.pop .pi{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);font-size:.84rem;cursor:pointer;transition:background .15s}
.pop .pi:hover{background:var(--surface-2)}
.pop .pi:last-child{border-bottom:0}
.pop .mi{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:.87rem;cursor:pointer;width:100%;border:0;background:none;text-align:left}
.pop .mi:hover{background:var(--surface-2)}
.cmdk .res{max-height:360px;overflow:auto}
.cmdk .ri{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;font-size:.88rem}
.cmdk .ri:hover,.cmdk .ri.on{background:var(--info-bg)}
.otp{display:flex;gap:8px;justify-content:center}
.otp input{width:46px;height:54px;text-align:center;font-size:1.35rem;font-weight:700;border:1px solid var(--border-2);border-radius:10px;background:var(--surface);transition:.15s}
.otp input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(8,113,255,.14);transform:translateY(-2px)}
.otp.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.meter{display:flex;gap:4px;margin-top:6px}.meter i{flex:1;height:5px;border-radius:4px;background:var(--border);transition:background .3s}
.rules{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:.78rem;color:var(--faint)}
.rules li{display:flex;align-items:center;gap:6px;transition:color .2s}.rules li.ok{color:var(--ok)}
.skel{background:linear-gradient(90deg,var(--neutral-bg) 25%,#f7f9fc 50%,var(--neutral-bg) 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:6px}
@keyframes sk{to{background-position:-200% 0}}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:9px;background:var(--info-bg);color:#123a78;font-size:.85rem;border:1px solid #cfe0ff}
.banner.warn{background:var(--warn-bg);color:#6b3d00;border-color:#f3dca6}
html[data-contrast="high"] .banner{color:#fff}
.inst{display:grid;grid-template-columns:32px 1.2fr 1.4fr 1fr 34px;gap:8px;align-items:center;margin-bottom:8px;animation:rise .3s var(--ease) both}
.inst .n{width:28px;height:28px;border-radius:50%;background:var(--neutral-bg);display:grid;place-items:center;font-weight:700;font-size:.78rem}
.calc{border:1px solid var(--border);border-radius:10px;overflow:hidden}
.calc .r{display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);font-size:.88rem}
.calc .r:last-child{border-bottom:0}
.calc .r.t{background:var(--ink);color:#fff;font-weight:700;font-size:.98rem}
.calc .r.sub{background:var(--surface-2);font-weight:600}
.matrix td,.matrix th{text-align:center}.matrix td:first-child,.matrix th:first-child{text-align:left}
.matrix input{width:17px;height:17px;accent-color:var(--blue);cursor:pointer}
.list-sel .li{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:9px;cursor:pointer;border:1px solid transparent;transition:.15s;margin-bottom:4px}
.list-sel .li:hover{background:var(--surface-2)}
.list-sel .li.on{background:var(--info-bg);border-color:#cfe0ff}
.dept-card{padding:18px;cursor:pointer;transition:transform .22s var(--ease),box-shadow .22s;position:relative;overflow:hidden}
.dept-card:hover{transform:translateY(-4px);box-shadow:var(--sh)}
.dept-card .bar{display:none}
.dept-ic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.8rem}
.ap-item{padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s,opacity .3s,transform .3s;position:relative}
.ap-item:hover{background:var(--surface-2)}
.ap-item.on{background:var(--info-bg)}
.ap-item.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue)}
.ap-item.gone{opacity:0;transform:translateX(40px)}
.checkl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checkl li{display:flex;gap:9px;align-items:center;font-size:.86rem}
.checkl .ok{color:var(--ok)}.checkl .warn{color:var(--warn)}

/* ================= AUTH ================= */
.auth{min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.auth-body{flex:1;display:grid;grid-template-columns:1.05fr 1fr;min-height:0}
.auth-hero{position:relative;overflow:hidden;color:#fff;padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;
  background:
   radial-gradient(circle at 0% 0%,#ff9d00 0 8%,#fb8d17 8% 14%,#ed6e2d 14% 20%,#d85239 20% 27%,#be3941 27% 34%,#a02644 34% 42%,#801843 42% 51%,#5e0f3d 51% 61%,#3e0933 61% 72%,#210024 72% 100%)}
.auth-hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 90%,rgba(255,192,0,.14),transparent 45%);pointer-events:none}
.auth-hero h1{color:#fff;font-size:2rem;line-height:1.2;max-width:520px}
.auth-hero .as{font-size:1.05rem;color:#ffe2b5;margin-top:10px}
.auth-hero ul{list-style:none;padding:0;margin:26px 0 0;display:flex;flex-direction:column;gap:12px;max-width:470px}

const emblem=()=>`<span class="emblem"><img src="${EMBLEM_SRC}" alt="Emblem of India"></span>`;
const strip=()=>`<div class="gov-strip"><span class="tri" aria-hidden="true"><i></i><i></i><i></i></span><b>${t('govAssam')}</b><span class="sep hide-s"></span><span class="hide-s muted">${t('tagline')}</span>
 <span class="grow"></span><a href="#main" class="hide-s" style="color:inherit">${t('skip')}</a><span class="sep hide-s"></span>
 <div class="a11y" role="group" aria-label="Text size and contrast"><button data-act="fs" data-v="-1" aria-label="Decrease font size">A-</button><button data-act="fs" data-v="0" aria-label="Reset font size">A</button><button data-act="fs" data-v="1" aria-label="Increase font size">A+</button><button data-act="contrast" aria-pressed="${document.documentElement.dataset.contrast==='high'}" aria-label="High contrast" title="High contrast">${ic('contrast',13)}</button></div>

function renderAuth(mode){
  const body=mode==='otp'?authOtp():mode==='forgot'?authForgot():authLogin();
  $('#root').innerHTML=`<div class="auth">${strip()}<div class="grad-line"></div><div class="auth-body">
   <section class="auth-hero"><div><div class="emb-big">${emblem()}<div><div style="font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:#ffe2b5;font-weight:600">${t('govAssam')}</div><div style="font-weight:700;font-size:1.05rem">${t('portalShort')} · Back Office</div></div></div>
   <h1>${L.en.portal}</h1><div class="as">${L.as.portal}</div><div class="as" style="margin-top:2px">${L.hi.portal}</div>
   <ul>${[['shield','Pre-defined, auditable approval workflows with e-Sign at every decision point'],['card','Single or multi-tranche disbursement via PFMS-DBT, treasury cheque, DD or deposit with Authority'],['file','Form D-based land compensation — Dag / Patta-wise payments cross-checked with the signed award'],['chart','Allocation vs paid, dues and ageing — by department, project and beneficiary']].map((x,i)=>`<li style="--i:${i}"><span class="b">${ic(x[0],16)}</span><span>${x[1]}</span></li>`).join('')}</ul></div>
   <div class="xs" style="color:#e9c7d4;position:relative;z-index:1">${ic('lock',13)} ${t('authOnly')} · Activity on this system is logged and monitored.</div></section>
   <section class="auth-pane" id="main"><div class="auth-card">${body}</div></section></div>
   <div class="auth-foot"><span>© ${t('govAssam')} · Prototype for design review — dummy data</span><span>Helpdesk: lacms-support@example.in · 1800-XXX-XXXX</span></div></div>`;
  bindOtp();
}
function authLogin(){return `<h2>${t('welcome')}</h2><p class="muted small" style="margin:6px 0 22px">Sign in with your departmental User ID. A one-time password will be sent to your registered mobile.</p>
 <form class="stack" data-form="login" novalidate>
  <label class="f">${t('userid')} <span class="inp-ic">${ic('user',16)}<input class="inp" name="u" value="rituraj.b.krm" autocomplete="username" required></span></label>
  <label class="f"><span class="row between">${t('password')}<a href="#/forgot" class="xs" style="font-weight:600">${t('forgot')}</a></span><span class="pw inp-ic">${ic('lock',16)}<input class="inp" type="password" name="p" value="Demo@2026" autocomplete="current-password" required><button type="button" data-act="pw" aria-label="Show password">${ic('eye',16)}</button></span></label>
  <label class="f">${t('captcha')}<span class="captcha"><span class="cap" id="cap">7K2mQ</span><button type="button" class="icon-btn" data-act="cap" aria-label="Refresh captcha">${ic('refresh',16)}</button><input class="inp" name="c" value="7K2mQ" style="flex:1" required></span></label>
  <label class="chk"><input type="checkbox" checked> Remember this device for 2FA for 12 hours</label>
  <div class="f">How would you like to start?<div class="seg tourseg" role="group" aria-label="Start mode" style="display:grid;grid-template-columns:1fr 1fr"><button type="button" data-act="tourmode" data-v="guided" class="${TR.mode==='guided'?'on':''}">${ic('flow',14)} Guided tour</button><button type="button" data-act="tourmode" data-v="normal" class="${TR.mode==='normal'?'on':''}">${ic('dash',14)} Normal</button></div><span class="hint" id="tourHint">${TR.mode==='guided'?'Each page explains itself step by step after you sign in.':'No automatic guides. Press "Guide" on any page when you need help.'}</span></div>
  <button class="btn primary block" type="submit">${t('signin')} ${ic('chev',16)}</button>
 </form>
 <div class="banner" style="margin-top:18px">${ic('alert',16)}<span class="small">Prototype: credentials are pre-filled. Never share your OTP — officials will never ask for it.</span></div>`}
function authOtp(){return `<button class="link small row" data-go="login" style="gap:4px;margin-bottom:14px">${ic('back',15)} Back</button>
 <h2>Two-factor verification</h2><p class="muted small" style="margin:6px 0 22px">Enter the 6-digit code sent to <b>${ME.mobile}</b> or generated by your authenticator app.</p>
 <form data-form="otp" class="stack"><div class="otp" id="otp">${'<input inputmode="numeric" maxlength="1" aria-label="Digit">'.repeat(6)}</div>
 <div class="row between small"><span class="muted" id="otpTimer">Resend code in 00:30</span><button type="button" class="link" data-act="altotp">Use authenticator app</button></div>
 <button class="btn primary block" type="submit">Verify & continue</button></form>

  st.tot=sum(st.rows,r=>+r.amt||0);st.rem=due-st.tot;

  $('#pSubmit').disabled=st.rem<0||st.tot<=0};

 $('#pRows').oninput=e=>{const el=e.target;if(el.dataset.i===undefined||el.tagName==='SELECT')return;st.rows[+el.dataset.i][el.dataset.k]=el.dataset.k==='amt'?el.value.replace(/[^0-9]/g,''):el.value;const pos=el.selectionStart;draw();const n=$(`#pRows [data-i="${el.dataset.i}"][data-k="${el.dataset.k}"]`);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}};

const csvEsc=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const toCSV=(h,rows)=>[h,...rows].map(r=>r.map(csvEsc).join(',')).join('\n');
// Excel files are read with SheetJS (loaded on first use); if it cannot load (offline), callers fall back to sample rows.
let _xlsx;const loadXLSX=()=>_xlsx||(_xlsx=window.XLSX?Promise.resolve(window.XLSX):new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=()=>ok(window.XLSX);sc.onerror=()=>{_xlsx=null;no()};document.head.appendChild(sc)}));
const readSheet=f=>/\.csv$/i.test(f.name)?f.text():loadXLSX().then(X=>f.arrayBuffer().then(b=>{const wb=X.read(b,{type:'array'});return X.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]],{blankrows:false,rawNumbers:true})})).catch(()=>{toast('Could not read the Excel file here — showing sample rows. Use the CSV copy instead.','warn');return null});
function parseCSV(t){t=t.replace(/^﻿/,'');const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){r.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);rows.push(r);r=[];f=''}else f+=c}if(f||r.length){r.push(f);rows.push(r)}return rows.filter(x=>x.some(v=>v.trim()))}

function validateRow(r,i,all){const E=[],W=[],v=k=>String(r[k]??'').trim(),land=v('asset_type')==='Land';
 BU_COLS.forEach(c=>{if((c[2]===1||(c[2]===2&&land)||(c[2]===3&&!land))&&!v(c[0]))E.push(`${c[1]} is missing`)});

 if(v('gender')&&!['Male','Female','Transgender'].includes(v('gender')))E.push('Gender not recognised');
 if(v('dob')&&!/^\d{4}-\d{2}-\d{2}$/.test(v('dob')))E.push('Date of birth must be YYYY-MM-DD');
 const mob=v('mobile').replace(/\D/g,'').replace(/^91(?=\d{10}$)/,'');if(v('mobile')&&mob.length!==10)E.push('Mobile must be 10 digits');
 if(v('aadhaar_last4')&&!/^\d{4}$/.test(v('aadhaar_last4')))E.push('Aadhaar (last 4) must be 4 digits');
 if(v('pin')&&!/^\d{6}$/.test(v('pin')))E.push('PIN must be 6 digits');
 if(v('ifsc')&&!/^[A-Z]{4}0[A-Z0-9]{6}$/i.test(v('ifsc')))E.push('IFSC must be 11 characters, e.g. SBIN0014567');
 if(v('state')&&!STATES.includes(v('state')))E.push(`State "${v('state')}" not recognised`);
 if(v('state')==='Assam'&&v('district')&&!ADIST.includes(v('district')))E.push(`"${v('district')}" is not a district of Assam`);
 const tl=TALUKA[v('district')];if(tl&&v('taluka')&&!tl.includes(v('taluka')))E.push(`Taluka "${v('taluka')}" is not in ${v('district')}`);
 if(v('asset_type')&&!ASSETS.includes(v('asset_type')))E.push('Asset type not recognised');
 if(land&&v('area_bkl')&&!/^\d+-[0-4]-(1?\d)$/.test(v('area_bkl')))E.push('Area must be Bigha-Katha-Lessa (Katha 0–4, Lessa 0–19)');
 if(!land&&v('assessed_amount')&&isNaN(+v('assessed_amount').replace(/,/g,'')))E.push('Assessed amount must be a number');
 const dup=all.findIndex((o,j)=>j<i&&String(o.aadhaar_last4??'').trim()===v('aadhaar_last4')&&String(o.name??'').trim().toLowerCase()===v('name').toLowerCase());
 if(v('aadhaar_last4')&&dup>=0)E.push(`Duplicate of row ${dup+1} (same name & Aadhaar)`);

 if(tb==='docs')return `<div class="tabpane stack">${[['fd','PDF','Form D — award statement (signed)',`${f.docs.fd.pages} pages · ${fsize(f.docs.fd.size)} · signed by ${f.signed.join(', ')}`],['sh','XLS','Data sheet',`${f.dags.length} Dag rows · ${fsize(f.docs.sh.size)} · parsed into the Dag register`]].map(x=>`<div class="filecard"><span class="fi xl" ${x[1]==='PDF'?'style="background:var(--bad-bg);color:var(--bad)"':''}>${x[1]}</span><div class="grow"><b>${x[2]}</b><div class="small">${esc(f.docs[x[0]].name)}</div><div class="xs faint">${x[3]} · version ${f.ver} · uploaded ${dfmt(f.regOn)} · SHA-256 recorded</div></div><button class="btn sm" data-act="fddoc" data-v="${f.id}" data-k="${x[0]}">${ic('eye',14)} View</button><button class="btn sm" data-act="toast" data-msg="Replacing a document creates version ${f.ver+1} and sends the Form D back to WF-FD verification">${ic('upload',14)} Replace</button></div>`).join('')}

 <div class="dag-grid">

  <div class="card"><div class="ch"><h2 class="ct">Award as per Form D</h2><span class="chip nod">Computed by department</span></div><div class="cb"><div class="calc">${[['(7) Land value'+(f.rate?' @ '+inr(f.rate)+' / bigha':''),b.c7],['(8) Trees',b.c8],['(9) Total market value',b.c9],['(10) Market value × 1.2',b.c10],['(11) Houses / structures',b.c11],['(12) Total (10 + 11)',b.c12],['(13) Solatium 100%',b.c13],['(14) Additional amount',b.c14]].map(r=>`<div class="r row between" style="padding:6px 0;border-bottom:1px dashed var(--border)"><span class="small muted">${r[0]}</span><b class="mono small">${inr2(r[1])}</b></div>`).join('')}<div class="row between" style="padding:10px 0 0"><b>(15) Total award</b><b class="mono">${inr2(d.aw)}</b></div></div><div class="xs faint" style="margin-top:8px">Read-only, imported from the data sheet. eCMS does not recalculate compensation.</div></div></div></div>

/* ---------- Initiate payment for a Dag (cross-referenced) ---------- */
const IFSC_RE=/^[A-Z]{4}0[A-Z0-9]{6}$/;
function pDagPay(arg){const [fid,dn]=(arg||'').split('/');const elig=FORMD.filter(f=>f.st==='Verified'&&f.dags.some(d=>dBal(d)>0&&!d.hold&&!dProc(d)));
 const f=fdOf(fid)&&elig.includes(fdOf(fid))?fdOf(fid):elig[0],ds=f.dags.filter(d=>dBal(d)>0&&!d.hold&&!dProc(d)),d=ds.find(x=>String(x.dag)===dn)||ds[0];
 S.py={f:f.id,dag:d.dag,sel:{0:{on:true,amt:String(dBal(d)),ifsc:'',ac:''}},x:{on:false,name:'',rel:'Legal heir',ref:'',amt:'',ifsc:'',ac:''},mode:MODES[0],ecr:'',date:'2026-09-30'};S.dirty=false;S.after=pyRefresh;

  ${fsec('Form D & Dag','Only verified Form D cases and Dags with an open balance are listed.',F('Form D case',SEL(elig.map(x=>[x.id,x.caseNo+' — '+x.village]),f.id,{id:'pyFd',req:1}),{req:1})+F('Dag / Patta',SEL(ds.map(x=>[String(x.dag),`Dag ${x.dag} · Patta ${x.patta} (${x.pt}) · balance ${inr2(dBal(x))}`]),String(d.dag),{id:'pyDag',req:1}),{req:1})+
   `<div class="span2 kv py-kv" style="padding:12px 14px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2)"><div><small>Awarded (Form D col 15)</small><span class="mono">${inr2(d.aw)}</span></div><div><small>Paid so far</small><span class="mono">${inr2(dPaid(d))}</span></div><div><small>Balance</small><span class="mono"><b>${inr2(dBal(d))}</b></span></div><div><small>Area · pattadars</small><span class="mono">${bkl(dLs(d))} · ${d.pat.length}</span></div></div>`)}
  <section class="fsec"><div><h3>Payee(s)</h3><p>Select pattadars listed on the Form D for this Dag, or add a payee not on the Form D (legal heir, power of attorney, purchaser). Unlisted payees route to WF-HV.</p></div><div id="pyPayees" style="min-width:0">${pyPayees()}</div></section>
  ${fsec('Payment details','',F('Payment mode',SEL(MODES,S.py.mode,{id:'pyMode'}),{req:1})+F('Scheduled date',`<input class="inp" type="date" id="pyDate" value="${S.py.date}">`,{req:1})+F('ECR no.',`<input class="inp mono" id="pyEcr" placeholder="e.g. 1676212/26" value="">`,{req:1,hint:'Reference recorded against the Dag on the Form D'})+F('Remarks',`<input class="inp" placeholder="Optional">`))}
 </div><aside class="stack fp-aside" id="pyAside">${pyAside()}</aside></div>
 <div class="fbar"><span class="grow small faint" id="pyHint">All cross-checks must pass to submit</span><button class="btn" data-act="fcancel" data-back="dag/${f.id}/${d.dag}">Cancel</button><button class="btn primary" id="pySubmit" data-act="pysubmit">${ic('sign',15)} Submit & e-Sign</button></div>${foot()}`}
const pyCtx=()=>{const f=fdOf(S.py.f),d=dagOf(f,S.py.dag);return {f,d}};
function pyPayees(){const {d}=pyCtx(),s=S.py;
 return `<div class="tbl-wrap" style="border:1px solid var(--border);border-radius:9px"><table class="tbl"><thead><tr><th></th><th>Pattadar</th><th>IFSC</th><th>Account no.</th><th class="num">Amount (₹)</th></tr></thead><tbody>
 ${d.pat.map((p,i)=>{const r=s.sel[i]||{};return `<tr class="${r.on?'sel':''}"><td class="cbcell"><input type="checkbox" class="cbx" data-act="pysel" data-v="${i}" ${r.on?'checked':''} aria-label="Pay ${esc(p.name)}"></td><td class="small"><b>${esc(p.name)}</b><div class="xs faint">${p.rel} ${esc(p.g)}</div></td>
  <td><input class="inp mono" style="width:100%;min-width:100px" data-py="ifsc" data-i="${i}" value="${esc(r.ifsc||'')}" placeholder="SBIN0001234" ${r.on?'':'disabled'}></td><td><input class="inp mono" style="width:100%;min-width:100px" data-py="ac" data-i="${i}" value="${esc(r.ac||'')}" placeholder="Account no." ${r.on?'':'disabled'}></td><td><input class="inp mono" style="width:100%;min-width:100px;text-align:right" data-py="amt" data-i="${i}" value="${esc(r.amt||'')}" ${r.on?'':'disabled'}></td></tr>`}).join('')}
 ${s.x.on?`<tr class="sel"><td class="cbcell"><input type="checkbox" class="cbx" data-act="pyx" checked aria-label="Remove unlisted payee"></td><td><input class="inp" data-py="name" data-i="x" placeholder="Payee name" value="${esc(s.x.name)}"><div class="row" style="gap:6px;margin-top:6px"><select class="inp" data-py="rel" data-i="x">${opts(['Legal heir','Power of attorney holder','Purchaser (registered sale deed)','Court-appointed guardian'],s.x.rel)}</select></div><input class="inp" style="margin-top:6px" data-py="ref" data-i="x" placeholder="Supporting order / certificate no." value="${esc(s.x.ref)}"></td>
  <td><input class="inp mono" data-py="ifsc" data-i="x" value="${esc(s.x.ifsc)}" placeholder="IFSC"></td><td><input class="inp mono" data-py="ac" data-i="x" value="${esc(s.x.ac)}" placeholder="Account no."></td><td><input class="inp mono" style="text-align:right" data-py="amt" data-i="x" value="${esc(s.x.amt)}"></td></tr>`:''}</tbody></table></div>
 <div class="row wrap" style="gap:8px;margin-top:10px"><button type="button" class="btn sm" data-act="pyfill" data-v="one">Full balance to first selected</button><button type="button" class="btn sm" data-act="pyfill" data-v="split">Split balance equally</button>${s.x.on?'':`<button type="button" class="btn sm" data-act="pyx">${ic('plus',14)} Payee not on Form D</button>`}<button type="button" class="btn sm ghost" data-act="pyfill" data-v="bank">Fill sample bank details</button></div>`}

 const bankOk=rows.length&&rows.every(r=>IFSC_RE.test(String(r[1].ifsc).toUpperCase())&&/^\d{9,18}$/.test(String(r[1].ac))&&(+String(r[1].amt).replace(/,/g,'')>0));
 const unlOk=!unl||(s.x.name.trim()&&s.x.ref.trim());const ecrOk=!!($('#pyEcr')&&$('#pyEcr').value.trim());
 const C={fd:[[f.st==='Verified','Form D verified (WF-FD)',`${f.caseNo} · e-Signed ${dfmt(f.verOn||f.regOn)}`],[true,`Dag ${d.dag} present on Form D`,`Row ${d.sl}, page ${d.page} of the signed PDF`],[true,'Same document version',`Sheet v${f.ver} parsed from Form D v${f.ver}`]],
  sh:[[true,`Data sheet row ${d.sl} · Dag ${d.dag}`,f.docs.sh.name],[true,`Patta ${d.patta} (${d.pt}) matches`,'Dag + Patta pair is unique in the case'],[Math.abs(d.aw-d.br.c12-d.br.c13-d.br.c14)<1.5||true,`Awarded ${inr2(d.aw)}`,'Column 15 as given by the department']],

  py:[[rows.length>0,rows.length?`${rows.length} payee${rows.length>1?'s':''} selected`:'Select at least one payee',''],[!!bankOk,bankOk?'Bank details valid':'IFSC / account / amount missing for a payee','PFMS name validation runs on submit'],[!!unlOk,unl?(unlOk?'Unlisted payee documented':'Name and order no. required for unlisted payee'):'All payees listed on Form D',unl?'Escalates to WF-HV':''],[ecrOk,ecrOk?'ECR no. entered':'Enter ECR no.','']]};
 const all=[...C.fd,...C.sh,...C.dg,...C.py].every(x=>x[0]);
 const wf=s.mode.startsWith('Deposit')?'WF-DEP':(unl||amt>25e5)?'WF-HV':dPaid(d)>0?'WF-INST':'WF-STD';
 return {C,all,amt,bal,wf,unl}}

/* ---------- Engine ---------- */
function trBuild(){const h=trHash(),k=trKey(h),cur=TSTEPS[k]?TSTEPS[k]():[{auto:true}],out=[];
 cur.forEach(s=>{if(s.auto)autoSteps().forEach(x=>out.push(x));else if(s.cols)out.push({lazy:()=>COLS(s.cols,s.help)});else out.push(s)});
 return out}
function trStart(force){trEnd();const h=trHash();TR.r=h;TR.steps=trBuild();TR.i=-1;TR.seen.add(trKey(h));if(!TR.steps.length)return;
 document.body.insertAdjacentHTML('beforeend',`<div class="tr-hole" id="trHole"></div><div class="tr-tip" id="trTip" role="dialog" aria-live="polite"></div>`);trGo(1)}
function trEnd(){$('#trHole')&&$('#trHole').remove();$('#trTip')&&$('#trTip').remove();TR.i=-1}
function trEl(s){if(s.el)return s.el;if(!s.s)return null;let el;if(s.match)el=$$(s.s).find(x=>x.textContent.trim()===s.match);else el=$(s.s);if(el&&s.parent)el=el.closest(s.parent)||el;return el}
function trGo(d){let i=TR.i+d;const run=()=>{if(i<0)i=0;if(i>=TR.steps.length)return trFinish();let s=TR.steps[i];
  if(s.lazy){const ex=s.lazy();TR.steps.splice(i,1,...ex);if(!ex.length){return run()}s=TR.steps[i]}
  if(s.pre&&d>0&&!s._ran){s._ran=1;try{s.pre()}catch(e){}return setTimeout(()=>{const el=trEl(s);if(s.s&&!vis(el)){i+=d;return run()}TR.i=i;trShow(s,el)},s.wait||420)}
  const el=trEl(s);if((s.s||s.el)&&!vis(el)){i+=d;if(i<0)return;return run()}TR.i=i;trShow(s,el)};run()}
function trShow(s,el){const tip=$('#trTip'),hole=$('#trHole');if(!tip)return;const n=TR.steps.length,last=TR.i===n-1,ji=JOURNEY.findIndex(j=>trKey(j[0])===trKey(TR.r)),nx=ji>=0&&ji<JOURNEY.length-1?JOURNEY[ji+1]:null,auth=['login','otp'].includes(trKey(TR.r));
 tip.innerHTML=`<div class="tr-top"><span class="tr-n">${TR.i+1} / ${n}</span><span class="tr-pg">${ji>=0?`Stop ${ji+1} of ${JOURNEY.length} · ${JOURNEY[ji][1]}`:esc(document.title.split(' – ')[0])}</span><button class="tr-x" data-tr="end" aria-label="Close tour">${ic('x',15)}</button></div><h4>${esc(s.t)}</h4><div class="tr-b">${s.b}</div>
  <div class="tr-prog"><i style="width:${(TR.i+1)/n*100}%"></i></div>
  <div class="tr-f">${TR.i?`<button class="btn sm" data-tr="back">${ic('back',13)} Back</button>`:'<span></span>'}<span class="grow"></span>${last?(auth?`<span class="xs muted">${s.last||''}</span><button class="btn sm primary" data-tr="end">Got it</button>`:nx&&TR.mode==='guided'?`<button class="btn sm" data-tr="end">End here</button><button class="btn sm primary" data-tr="next-page" data-v="${nx[0]}">Next stop: ${nx[1]} ${ic('chev',13)}</button>`:`<button class="btn sm primary" data-tr="finish">Finish</button>`):`<button class="btn sm primary" data-tr="next">Next ${ic('chev',13)}</button>`}</div>
  ${TR.mode==='guided'&&!auth?`<button class="tr-off" data-tr="off">Switch to normal mode (no automatic guides)</button>`:''}`;
 if(!el){hole.style.cssText='left:50%;top:50%;width:0;height:0';tip.classList.add('center');tip.style.cssText='';return}
 tip.classList.remove('center');const inModal=el.closest('.modal'),r=el.getBoundingClientRect(),off=r.top<130||r.bottom>innerHeight-90;if(!inModal&&off&&r.height<innerHeight-200)el.scrollIntoView({block:'center',behavior:'smooth'});else el.scrollIntoView({block:'nearest'});
 TR.el=el;trPlace(el);clearTimeout(TR._t);TR._t=setTimeout(()=>trPlace(el),inModal?60:420);setTimeout(()=>TR.el===el&&trPlace(el),800)}
function trPlace(el){const tip=$('#trTip'),hole=$('#trHole');if(!tip||!el)return;const r=el.getBoundingClientRect(),p=6,W=innerWidth,H=innerHeight;
 const rr={l:Math.max(4,r.left-p),t:Math.max(4,r.top-p),w:Math.min(W-8,r.width+p*2),h:Math.min(H-8,r.height+p*2)};
 hole.style.cssText=`left:${rr.l}px;top:${rr.t}px;width:${rr.w}px;height:${rr.h}px`;
 const tw=Math.min(380,W-24),th=tip.offsetHeight;let x,y;
 if(rr.t+rr.h+12+th<H){y=rr.t+rr.h+12;x=rr.l}else if(rr.t-12-th>0){y=rr.t-12-th;x=rr.l}else if(rr.l+rr.w+12+tw<W){x=rr.l+rr.w+12;y=Math.max(12,Math.min(H-th-12,rr.t))}else if(rr.l-12-tw>0){x=rr.l-12-tw;y=Math.max(12,Math.min(H-th-12,rr.t))}else{x=(W-tw)/2;y=H-th-12}
 x=Math.max(12,Math.min(W-tw-12,x));tip.style.cssText=`left:${x}px;top:${y}px;width:${tw}px`}
function trFinish(){const ji=JOURNEY.findIndex(j=>trKey(j[0])===trKey(TR.r));trEnd();if(ji===JOURNEY.length-1&&TR.mode==='guided')trDone()}
function trDone(){modal(`<div class="dh"><h3>Tour complete</h3><button class="icon-btn" data-act="close" aria-label="Close">${ic('x')}</button></div><div class="db stack"><p class="small" style="margin:0">You have seen the whole land acquisition payment process:</p><div class="tl">${['Register the signed Form D and its data sheet','Cross-check the sheet against the Form D totals','LRA / ADC verify the Form D (WF-FD)','Pay one Dag or several Dags — split between pattadars, in parts if needed','Approve with e-Sign, bill to treasury, record the credit','Track payments, budget and reports'].map(x=>`<div class="it"><b class="small">${x}</b></div>`).join('')}</div><p class="xs muted" style="margin:0">Every other page (departments, schemes, users, roles, profile …) has its own guide — open the page and press <b>Guide</b>.</p></div><div class="df"><button class="btn" data-act="close">Close</button><button class="btn primary" data-tr="restart">Start again</button></div>`)}
function trAuto(){if(TR.mode!=='guided')return;const k=trKey(trHash());if(TR.seen.has(k))return;if(!S.authed&&!['login','otp'].includes(k))return;clearTimeout(TR._a);TR._a=setTimeout(()=>{if(trKey(trHash())===k&&!$('.modal'))trStart()},750)}
const trFab=()=>{if($('#trFab'))return;document.body.insertAdjacentHTML('beforeend',`<button class="tr-fab" id="trFab" data-tr="start" aria-label="Guide for this page">${ic('flow',16)} Guide</button>`)};
window.addEventListener('hashchange',()=>{trEnd();trAuto()});
window.addEventListener('resize',()=>TR.i>=0&&TR.el&&trPlace(TR.el));
window.addEventListener('scroll',()=>{if(TR.i>=0&&TR.el){cancelAnimationFrame(TR._r);TR._r=requestAnimationFrame(()=>trPlace(TR.el))}},true);
document.addEventListener('click',e=>{const a=e.target.closest('[data-tr]');
 const tm=e.target.closest('[data-act=tourmode]');if(tm){TR.mode=tm.dataset.v;trSave();$$('.tourseg button').forEach(b=>b.classList.toggle('on',b===tm));$('#tourHint')&&($('#tourHint').textContent=TR.mode==='guided'?'Each page explains itself step by step after you sign in.':'No automatic guides. Press "Guide" on any page when you need help.');if(TR.mode==='normal')trEnd();return}
 if(!a)return;const v=a.dataset.tr;
 if(v==='next')trGo(1);if(v==='finish')trFinish();if(v==='back')trGo(-1);if(v==='end')trEnd();if(v==='start'){TR.seen.delete(trKey(trHash()));trStart(true)}
 if(v==='off'){TR.mode='normal';trSave();trEnd();toast('Normal mode — press Guide on any page for help','info')}
 if(v==='next-page'){trEnd();const k=trKey(a.dataset.v);TR.seen.delete(k);if(trHash()===a.dataset.v)trStart();else go(a.dataset.v)}
 if(v==='restart'){closeOverlay();TR.seen.clear();TR.mode='guided';trSave();go('dashboard')}});
document.addEventListener('keydown',e=>{if(TR.i<0||!$('#trTip'))return;if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;
 if(e.key==='ArrowRight'){e.preventDefault();const n=$('#trTip [data-tr=next]');n?trGo(1):null}if(e.key==='ArrowLeft'&&TR.i>0){e.preventDefault();trGo(-1)}if(e.key==='Escape')trEnd()});
setInterval(()=>{if(S.authed)trFab();else $('#trFab')&&$('#trFab').remove()},800);
setTimeout(trAuto,900);

Object.assign(CHIP,{'Awaiting approval':'warn','Sent to bank':'info pulse'});
const PST={'Pending approval':'Awaiting approval','Bill generated':'Bill generated','Processing at Treasury':'Sent to bank','Credited':'Credited','Returned – A/c mismatch':'Returned'};
const hsh=s=>[...String(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
const bankNm=i=>{const b=BANKS.find(x=>x[1]===String(i||'').slice(0,4).toUpperCase());return b?b[0]:'—'};
const dtm=d=>d?dfmt(d)+', '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'):'—';
S.ptx={tab:'all',src:'',mode:'',q:''};S.ptSync=new Date('2026-09-24T14:15:00');
function ptRows(){const out=[];
 FORMD.forEach(f=>f.dags.forEach(d=>d.pays.forEach(p=>out.push({key:'L|'+f.id+'|'+d.dag+'|'+p.req,src:'land',o:p,req:p.req,date:new Date(p.date),payee:p.payee,rel:p.prel,against:`Dag ${d.dag} · ${f.caseNo.replace('LA Case No. ','LA ')}`,link:`dag/${f.id}/${d.dag}`,amt:p.amt,mode:p.mode,ifsc:p.ifsc,ac:p.ac,bill:p.bill,ecr:p.ecr,utr:p.utr,st:PST[p.st]||p.st,wf:p.wf,batch:p.batch||''}))));
 TXN.forEach(x=>out.push({key:'T|'+x.b.id+'|'+x.no,src:'other',o:x,req:'PR/KMP/26-27/'+(300+hsh(x.b.id+x.no)%300),date:x.date,payee:x.b.name,rel:x.b.rel+' '+x.b.gname,against:`${prj(x.b.proj).name} · tranche ${x.no} of ${x.of}`,link:'beneficiary/'+x.b.id,amt:x.amt,mode:x.mode,ifsc:x.b.ifsc,ac:x.b.acc,bill:x.bill,ecr:'',utr:x.status==='Credited'?x.utr:'',st:PST[x.status]||x.status,wf:x.no>1?'WF-INST':'WF-STD',batch:''}));
 return out.sort((a,b)=>b.date-a.date)}
function ptBank(r){const h=hsh(r.key),at=n=>{const d=addDays(r.date,n);d.setHours(9+h%8,(h>>3)%60);return d>TODAY?new Date(TODAY):d},sent=['Sent to bank','Credited','Returned'].includes(r.st);
 return {sent,pfmsId:sent?'PFMS-AS-'+String(1e6+h%9e6):'',bankRef:sent?String(r.ifsc).slice(0,4)+'TXN'+String(h%1e9).padStart(9,'0'):'',sentAt:sent?at(0):null,ackAt:sent?at(0):null,valueDate:r.st==='Credited'?at(1):null,
  code:{Credited:'ACSC','Sent to bank':'ACSP',Returned:'RJCT'}[r.st]||'—',msg:{Credited:'Credited to beneficiary account','Sent to bank':'Accepted by bank, settlement in process',Returned:'Rejected by beneficiary bank','Awaiting approval':'Not yet sent — approval pending','Bill generated':'Bill generated — not yet sent to bank'}[r.st]||'',
  reason:r.st==='Returned'?'BE01 · Beneficiary name does not match account holder':'',nameMatch:r.st==='Returned'?61:90+h%10}}
const ptFilt=()=>{const f=S.ptx,q=f.q.trim().toLowerCase();return ptRows().filter(r=>(f.tab==='all'||r.st===f.tab)&&(!f.src||r.src===f.src)&&(!f.mode||r.mode===f.mode)&&(!q||(r.req+' '+r.payee+' '+r.against+' '+r.utr+' '+r.ecr+' '+r.bill+' '+r.batch).toLowerCase().includes(q)))};

 if(!rows.length)return `<div class="empty"><div class="ei">${ic('search',22)}</div><b>No transactions match</b></div>`;

 <div class="pager"><span>Showing ${shown.length} of ${rows.length} transactions · ${inr2(sum(rows,'amt'))} · click a row for bank details</span></div>`}

  if(x.id==='sCause')refresh('#sCauseBody',causeBody(x.value,null));
  if(x.id==='sCirc')$('#sVil').innerHTML=vilChecks(x.value,false);
  if(x.id==='rCopy'&&x.value)$('#rMatrix').innerHTML=matrix(ROLES.find(r=>r.id===x.value).p,true);
});
document.addEventListener('change',e=>{const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
  if(act==='lang'){S.lang=a.value;save();document.documentElement.lang=S.lang;const h=location.hash.replace(/^#\/?/,'');if(['login','otp','forgot',''].includes(h.split('/')[0])&&!S.authed)renderAuth(h.split('/')[0]||'login');else{renderShell();route()}toast(S.lang==='as'?'ভাষা সলনি কৰা হ’ল · অসমীয়া':S.lang==='hi'?'भाषा बदली गई · हिन्दी':'Language changed · English','info')}
  if(act==='bdept'){S.bf.dept=a.value;S.bf.proj='';S.bpage=1;go('beneficiaries')}
  if(act==='bproj'){S.bf.proj=a.value;S.bpage=1;refresh('#benTable',benTable())}
  if(act==='bkyc'){S.bf.kyc=a.value;S.bpage=1;refresh('#benTable',benTable())}
  if(act==='rdept'){S.rpDept=a.value;refresh('#repBody',repBody())}});
document.addEventListener('input',e=>{const a=e.target;
  if(a.closest&&a.closest('.fpage'))S.dirty=true;
  if(a.id==='bpQ'){S.bp.q=a.value;clearTimeout(window._bq2);window._bq2=setTimeout(()=>{bpRender();const q=$('#bpQ');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}},250)}
  if(a.id==='bpPct'||a.id==='bpFixed'){const k=a.id==='bpPct'?'pct':'fixed';S.bp[k]=a.value.replace(/\D/g,'');if(k==='pct'&&+S.bp.pct>100)S.bp.pct='100';$('#bpTbl tbody').innerHTML=bpAmtRows();bpRecalc()}
  if(a.dataset.bpc){S.bp.custom[a.dataset.bpc]=a.value.replace(/\D/g,'');bpRecalc()}
  if(a.dataset.w&&S.wd){S.wd[a.dataset.w]=a.type==='checkbox'?a.checked:a.value;if(['B','K','L'].includes(a.dataset.w)&&$('#areaHint'))$('#areaHint').innerHTML=areaHint();if(a.dataset.w==='ifsc'&&$('#bankName'))$('#bankName').value=bankOf(a.value)}
  if(a.dataset.act==='bq'){S.bf.q=a.value;S.bpage=1;clearTimeout(window._bq);window._bq=setTimeout(()=>refresh('#benTable',benTable()),160)}
  if(a.classList.contains('err'))a.classList.remove('err');
  if(a.dataset.pw){const v=a.value,r={len:v.length>=12,up:/[a-z]/.test(v)&&/[A-Z]/.test(v),num:/\d/.test(v),sym:/[^A-Za-z0-9]/.test(v)},n=Object.values(r).filter(Boolean).length,c=['#c0262d','#f47d24','#ffc000','#11804a'];
   $$('#meter i').forEach((i,k)=>i.style.background=k<n?c[n-1]:'');Object.entries(r).forEach(([k,ok])=>{const li=$(`#rules [data-r=${k}]`);li&&li.classList.toggle('ok',ok)})}});
document.addEventListener('submit',e=>{const f=e.target.dataset.form;if(!f)return;e.preventDefault();
  if(f==='login'){const b=$('button[type=submit]',e.target);b.innerHTML='<span class="skel" style="width:90px;height:12px;display:inline-block"></span>';setTimeout(()=>go('otp'),650)}
  if(f==='otp'){if(otpVal().length<6){const o=$('#otp');o.classList.remove('shake');void o.offsetWidth;o.classList.add('shake');return}S.authed=true;save();renderShell();go('dashboard');setTimeout(()=>toast(`Signed in as ${ME.name} · 2FA verified`,'ok'),300)}
  if(f==='fp0'||f==='fp1'){if(f==='fp1'&&otpVal().length<6){$('#otp').classList.add('shake');return}const n=f==='fp0'?1:2;$('#fpStep').innerHTML=['Identify','Verify OTP','New password'].map((x,i)=>`<div class="stp ${i<n?'done':i===n?'on':'pend'}"><span class="n">${i<n?ic('tick',14,2.6):i+1}</span><span class="t">${x}</span></div>`).join('');$('#fpBody').innerHTML=`<div class="tabpane">${fpStep(n)}</div>`;bindOtp();if(n===1)toast('OTP sent to +91 98XXX X4172','info')}
  if(f==='fp2'){toast('Password updated. Please sign in with your new password.','ok');go('login')}
  if(f==='chpw'){toast('Password changed · all other sessions signed out','ok');e.target.reset();$$('#meter i').forEach(i=>i.style.background='')}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'&&S.authed){e.preventDefault();cmdk()}if(e.key==='Escape')closeOverlay()});
const bpSelSync=()=>{const s=S.bp;$('#bpSum').innerHTML=`<b>${s.sel.size}</b> selected · <b class="mono">${inr(sum(bpSelRows(),b=>b.total-b.paid))}</b> due`;$('#bpFoot').innerHTML=bpFoot();$('#bpAside').innerHTML=bpAside()};
document.addEventListener('dragover',e=>{e.preventDefault();const d=e.target.closest&&e.target.closest('[data-drop]');$$('[data-drop].over').forEach(x=>x!==d&&x.classList.remove('over'));if(d)d.classList.add('over')});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('[data-drop]');if(d&&!d.contains(e.relatedTarget))d.classList.remove('over')});
document.addEventListener('drop',e=>{e.preventDefault();const d=e.target.closest&&e.target.closest('[data-drop]');if(!d)return;d.classList.remove('over');const f=e.dataTransfer.files[0];d.dataset.drop==='bu'?buFileIn(f):d.dataset.drop==='bp'?bpFileIn(f):fnFileIn(d.dataset.drop,f)});
window.addEventListener('hashchange',route);
document.documentElement.lang=S.lang;
route();
</script>
